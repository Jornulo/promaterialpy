[metadata]
name = promaterialpy
version = 0.1.0
author = Jorge Rolando Aaron Nunez Lopez
author_email = arenzocaceresrossi@gmail.com
description = A curated collection of mechanical, structural, and materials engineering datasets for mechanical-electrical design, computational modeling, and research.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/jornulo/promaterialpy
project_urls =
    Bug Tracker = https://github.com/jornulo/promaterialpy/issues
    Documentation = https://github.com/jornulo/promaterialpy
    Source Code = https://github.com/jornulo/promaterialpy
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    Intended Audience :: Education
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Scientific/Engineering :: Physics
    Topic :: Scientific/Engineering :: Information Analysis
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Operating System :: OS Independent
    Natural Language :: English
keywords = materials, engineering, mechanical, electrical, structural, materials science, datasets, youngs modulus, elastic parameters, poisson ratio, yield strength, tensile strength, hardness, steel, alloy, composite materials, manufacturing, simulation, standard standards, ansi, din, iso, data science, research

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pandas>=1.5
include_package_data = True
zip_safe = False

[options.packages.find]
exclude =
    tests*
    docs*
    examples*

[options.package_data]
promaterialpy = data/*.csv

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov
    black
    flake8
    mypy
docs =
    mkdocs
    mkdocs-material

# Configuration for pytest
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --cov=promaterialpy
    --cov-report=html
    --cov-report=term

# Configuration for coverage
[coverage:run]
source = promaterialpy
omit =
    */tests/*
    */test_*.py
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

# Configuration for flake8
[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .venv,
    env,
    venv

# Configuration for mypy
[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False